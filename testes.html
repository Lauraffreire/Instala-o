<!doctype html>
<html lang="pt-PT">
  <meta charset="utf-8">
  <title>Verificação da instalação</title>
  <body>
    <h1>Verificação da instalação</h1>
    <pre id="results">A verificar…</pre>
    <iframe src="index.html" style="width:1100px;height:750px" title="Instalação em teste">
    </iframe>
    <script>
      document.querySelector('iframe').onload = function() {
        const app = this.contentWindow,
          doc = this.contentDocument,
          checks = [],
          key = 'pages-of-you-v1',
          original = localStorage.getItem(key);
        const assert = (ok, name) => {
          if (!ok) throw Error(name);
          checks.push(name);
        };
        try {
          assert(doc.querySelectorAll('.spine').length > 0, 'Estante inicial disponível');
          const shelf = doc.querySelector('#shelf');
          const originalShelf = shelf.innerHTML;
          const firstSpine = shelf.querySelector('.spine');
          for (let index = 0; index < 30; index++) {
            const clone = firstSpine.cloneNode(true);
            clone.dataset.book = 'extra-' + index;
            shelf.append(clone);
          }
          assert(shelf.scrollWidth > shelf.clientWidth, 'Muitos livros criam uma estante horizontal');
          app.updateShelfArrows();
          assert(doc.querySelector('#shelf-left').hidden && !doc.querySelector('#shelf-right').hidden,
            'No início, só aparece a seta para mais livros à direita');
          app.slideShelf(1, 'instant');
          app.updateShelfArrows();
          assert(shelf.scrollLeft > 0, 'Deslizar avança na estante');
          assert(!doc.querySelector('#shelf-left').hidden, 'Depois de avançar aparece a seta de regresso');
          const visibleSpine = [...shelf.querySelectorAll('.spine')].find(button => {
            const rect = button.getBoundingClientRect();
            const bounds = shelf.getBoundingClientRect();
            return rect.left > bounds.left && rect.right < bounds.right;
          });
          const spineBounds = visibleSpine.getBoundingClientRect();
          assert(app.shelfBookAt((spineBounds.left + spineBounds.right) / 2) === visibleSpine,
            'Seleção corresponde ao livro visível depois de deslizar');
          app.slideShelf(-1, 'instant');
          assert(shelf.scrollLeft === 0, 'Deslizar para trás regressa ao início');
          shelf.innerHTML = originalShelf;
          app.updateShelfArrows();
          assert(!doc.querySelector('#tracking-feedback') && !doc.querySelector('#camera-toggle') && doc
            .querySelector('#camera').hidden, 'Sem painel, imagem de câmara ou ativação manual');
          const hand = Array.from({
            length: 21
          }, (_, index) => ({
            x: .25 + index * .01,
            y: .3 + index * .01
          }));
          app.drawHandFeedback([hand], hand);
          assert(doc.querySelector('#hand-landmarks').width === app.innerWidth,
            'Pontos da mão desenhados no ecrã');
          app.drawHandFeedback([]);
          assert(doc.querySelector('#hand-landmarks').getContext('2d').getImageData(0, 0, 1, 1).data[3] === 0,
            'Perda da mão limpa o feedback');
          const still = app.smoothHandCursor({
            x: .5,
            y: .5
          }, {
            x: .501,
            y: .501
          });
          assert(still.x === .5 && still.y === .5, 'Zona morta ignora pequenos tremores');
          const smooth = app.smoothHandCursor({
            x: .5,
            y: .5
          }, {
            x: .8,
            y: .5
          });
          assert(smooth.x > .5 && smooth.x < .8, 'Cursor aproxima-se suavemente do alvo');
          const motion = (dx, dy, step = 70) => Array.from({
            length: 6
          }, (_, i) => ({
            x: .5 + dx * i / 5,
            y: .5 + dy * i / 5,
            time: i * step
          }));
          assert(app.horizontalSwipe(motion(-.25, .01)) === 1, 'Deslize para esquerda avança');
          assert(app.horizontalSwipe(motion(.25, .01)) === -1, 'Deslize para direita recua');
          assert(app.horizontalSwipe(motion(.2, .3)) === 0, 'Movimento vertical não vira a página');
          assert(app.horizontalSwipe(motion(.25, 0, 200)) === 0, 'Deslocação demasiado lenta não vira a página');
          const pose = Array.from({
            length: 33
          }, () => ({
            x: .5,
            y: .5,
            visibility: 0
          }));
          pose[11].visibility = .8;
          pose[12].visibility = .8;
          assert(app.bodyInFrame({
            landmarks: [pose]
          }), 'Ombros visíveis mantêm presença sem mãos');
          assert(!app.bodyInFrame({
            landmarks: []
          }) && !app.bodyInFrame({
            landmarks: [pose.map(point => ({
              ...point,
              visibility: .1
            }))]
          }), 'Sem corpo fiável não confirma presença');
          const fixture = {
            books: [{
              id: 'teste-instalacao',
              name: 'Pessoa de teste',
              code: 'POY-TESTE',
              visibility: 'public',
              color: '#697658',
              pages: [{
                background: '#ffffff',
                pattern: 'dots',
                elements: [{
                  id: 'linha',
                  type: 'text',
                  text: '1. Uma memória boa',
                  x: 50,
                  y: 50,
                  width: 400,
                  height: 80,
                  fontSize: 24,
                  templateLine: true
                }, {
                  id: 'som',
                  type: 'audio',
                  src: 'data:audio/mpeg;base64,AAAA'
                }]
              }, {
                background: '#ffffff',
                elements: []
              }],
              memories: []
            }, {
              id: 'privado',
              name: 'Livro privado',
              visibility: 'private',
              memories: []
            }],
            pending: []
          };
          localStorage.setItem(key, JSON.stringify(fixture));
          app.dispatchEvent(new StorageEvent('storage', {
            key
          }));
          assert(doc.querySelectorAll('.spine').length === 1, 'Só livros públicos aparecem');
          doc.querySelector('.spine').click();
          assert(doc.querySelector('#reader').hidden, 'Lombada sem comando de rato');
          app.openBook('teste-instalacao');
          assert(!doc.querySelector('#reader').hidden, 'Abrir livro');
          assert(doc.querySelector('#book-code').textContent.includes('POY-TESTE'), 'Código apresentado');
          assert(doc.querySelectorAll('#spread .sheet').length === 2, 'Duas páginas lado a lado');
          assert(doc.querySelector('.template-line').textContent === '1. Uma memória boa',
            'Texto e modelo preservados');
          assert(doc.querySelector('.pattern-dots'), 'Padrão preservado');
          assert(!doc.querySelector('audio'), 'Instalação sem som');
          doc.querySelector('#next').click();
          assert(doc.querySelector('#page-status').textContent === '3–3 / 3', 'Folhear para última página');
          assert(doc.querySelector('#next').disabled, 'Limite de páginas respeitado');
          app.document.dispatchEvent(new KeyboardEvent('keydown', {
            key: 'ArrowLeft',
            bubbles: true
          }));
          assert(doc.querySelector('#next').disabled, 'Teclado não folheia');
          doc.querySelector('#previous').click();
          assert(doc.querySelector('#previous').disabled, 'Seleção gestual folheia para trás');
          app.document.dispatchEvent(new KeyboardEvent('keydown', {
            key: 'Escape',
            bubbles: true
          }));
          assert(!doc.querySelector('#reader').hidden, 'Escape não comanda a instalação');
          doc.querySelector('#return-shelf').click();
          assert(doc.querySelector('#reader').hidden, 'Seleção gestual regressa à estante');
          assert(localStorage.getItem(key) === JSON.stringify(fixture),
            'Instalação não altera os dados de criação');
          document.querySelector('#results').textContent = JSON.stringify({
            ok: true,
            checks
          }, null, 2);
        } catch (error) {
          document.querySelector('#results').textContent = JSON.stringify({
            ok: false,
            error: error.stack,
            checks
          }, null, 2);
        } finally {
          if (original === null) localStorage.removeItem(key);
          else localStorage.setItem(key, original);
          app.dispatchEvent(new StorageEvent('storage', {
            key
          }));
        }
      };
    </script>
  </body>
</html>
